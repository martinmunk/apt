# Rebuild the apt repository from the GitHub Release assets of the repos in
# packages.txt and publish it with GitHub Pages. Runs on a schedule, on demand,
# on every push to main, and when a package repo sends a `package-released`
# repository_dispatch (see avr-controld's release workflow).
name: Build and publish apt repository

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils gnupg
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "GPG_PRIVATE_KEY secret is not set"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons | grep -q '^sec' || { echo "no secret key imported"; exit 1; }
      - name: Build the repository tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-repo.sh _site
      - name: Verify the signature with the published public key
        run: |
          d=$(mktemp -d); gpg --homedir "$d" --batch --import _site/martinmunk-apt.gpg 2>/dev/null
          gpg --homedir "$d" --batch --verify _site/dists/trixie/InRelease
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
